name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pytest ruff
      - name: Secret leak guard
        shell: bash
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!docs/**'; then
            echo 'Potential committed secret detected.'
            exit 1
          fi
      - run: ruff check backend/lambda ml tests
      - name: Reproduce ML artifacts
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git show HEAD:backend/lambda/model.json > "$tmp_dir/model.json"
          git show HEAD:ml/evaluation.json > "$tmp_dir/evaluation.json"
          git show HEAD:ml/hybrid_evaluation.json > "$tmp_dir/hybrid_evaluation.json"
          python ml/train.py
          python ml/evaluate_hybrid.py
          python - "$tmp_dir/model.json" backend/lambda/model.json "$tmp_dir/evaluation.json" ml/evaluation.json "$tmp_dir/hybrid_evaluation.json" ml/hybrid_evaluation.json <<'PY'
          import json
          import sys
          from pathlib import Path

          if len(sys.argv[1:]) % 2:
              raise SystemExit("artifact comparison requires path pairs")
          for expected_path, actual_path in zip(sys.argv[1::2], sys.argv[2::2]):
              expected = json.loads(Path(expected_path).read_text(encoding="utf-8"))
              actual = json.loads(Path(actual_path).read_text(encoding="utf-8"))
              if expected != actual:
                  raise SystemExit(f"Generated artifact differs semantically: {actual_path}")
          print("ML artifacts are reproducible (semantic JSON comparison).")
          PY
      - run: pytest -q
      - name: Compile Python
        run: python -m compileall -q backend/lambda ml
      - name: Verify frontend assets and JavaScript
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/app.js
          node --check frontend/app.js
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Validate SAM template
        run: sam validate --lint -t infrastructure/template.yaml
      - name: Build SAM package
        run: sam build -t infrastructure/template.yaml
      - name: Verify Lambda package contents
        run: |
          test -s .aws-sam/build/ScanFunction/handler.py
          test -s .aws-sam/build/ScanFunction/model.json
          test -s .aws-sam/build/ScanFunction/risk_engine.py
