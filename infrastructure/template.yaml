AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RuralShield AI - serverless phishing detection for rural banking
Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:8080
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
  BedrockPublicAccess:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Allow anonymous scans to invoke paid Bedrock inference. Keep false for safer demos.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 20
    MemorySize: 768
    Environment:
      Variables:
        TABLE_NAME: !Ref ScanTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_PUBLIC_ACCESS: !Ref BedrockPublicAccess
        ALLOWED_ORIGINS: !Ref AllowedOrigin
        LOG_LEVEL: INFO

Resources:
  RuralShieldApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}
              audience:
                - !Ref CognitoUserPoolClient
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/
      Handler: handler.lambda_handler
      Description: Hybrid RuralShield phishing scan API
      Policies:
        - Statement:
            - Sid: StoreAndReadOwnedScanRecords
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt ScanTable.Arn
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuralShieldApi
            Path: /scan
            Method: POST
        History:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuralShieldApi
            Path: /history
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Statistics:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuralShieldApi
            Path: /statistics
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Feedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuralShieldApi
            Path: /feedback
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref RuralShieldApi
            Path: /health
            Method: GET

  ScanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ScanFunction}
      RetentionInDays: 14

  ScanTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: owner_id, AttributeType: S}
        - {AttributeName: scan_key, AttributeType: S}
      KeySchema:
        - {AttributeName: owner_id, KeyType: HASH}
        - {AttributeName: scan_key, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-frontend-oac
        Description: Signed access from CloudFront to the private RuralShield frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies: {Forward: none}
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate: {CloudFrontDefaultCertificate: true}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${RuralShieldApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Value: !Sub https://${FrontendDistribution.DomainName}
  ScanTableName:
    Value: !Ref ScanTable
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoRegion:
    Value: !Ref AWS::Region
